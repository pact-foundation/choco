name: update

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ scoop-package-released ]

jobs:

  update-packages:
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@main
      - run: python update-packages.py
        shell: bash

      - name: Create PR for version update
        id: create-pr
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Packages already match the scoop manifests; no PR needed"
            exit 0
          fi
          BRANCH="deps_update/${GITHUB_RUN_ID}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          git config pull.ff only
          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore(release): deps update"
          git push --set-upstream origin "$BRANCH"
          gh pr create --title "chore(release): deps update" --fill
          echo "🎉 Done!"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

